<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<title>Reviews — Neutronic</title>
<meta name="description" content="Reviews and testimonials for Neutronic software.">
<style>
  :root{
    --void:#07090c;--panel:#0d1117;--panel-2:#11161e;--line:#1c2330;
    --ink:#eef2f7;--muted:#8b96a6;--dim:#5b6675;
    --cyan:#3b82f6;--lime:#7dd3fc;--violet:#1d4ed8;
    --radius:16px;--max:880px;
  }
  *{margin:0;padding:0;box-sizing:border-box}
  html{scroll-behavior:smooth}
  body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Inter,Roboto,Helvetica,Arial,sans-serif;background:var(--void);color:var(--ink);line-height:1.65;-webkit-font-smoothing:antialiased;overflow-x:hidden}
  ::selection{background:var(--cyan);color:#04070a}
  a{color:inherit;text-decoration:none}
  .wrap{max-width:var(--max);margin:0 auto;padding:0 24px}
  .mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}

  header{position:sticky;top:0;z-index:50;background:rgba(7,9,12,.72);backdrop-filter:blur(14px);border-bottom:1px solid var(--line)}
  nav{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;height:70px}
  nav .logo{justify-self:start}
  nav .nl{justify-self:center}
  nav > .btn{justify-self:end}
  .logo{display:flex;align-items:center;gap:11px;font-weight:800;font-size:18px;letter-spacing:-.02em}
  .mark{width:34px;height:34px;border-radius:9px;object-fit:contain;box-shadow:0 0 22px -4px rgba(59,130,246,.5)}
  .nl{display:flex;gap:30px;font-size:14px;color:var(--muted)}
  .nl a:hover{color:var(--ink)}
  .nl a.active{color:var(--ink)}
  .btn{display:inline-flex;align-items:center;gap:9px;border-radius:999px;font-weight:650;font-size:14px;transition:transform .16s,opacity .16s}
  .btn:hover{transform:translateY(-2px)}
  .btn-p{background:linear-gradient(120deg,var(--cyan),#60a5fa);color:#04070a;padding:11px 20px;box-shadow:0 10px 30px -12px rgba(59,130,246,.8)}
  @media(max-width:780px){.nl{display:none}}

  .pagehead{padding:72px 0 44px;border-bottom:1px solid var(--line);position:relative;overflow:hidden}
  .glow{position:absolute;top:-200px;left:-100px;width:520px;height:520px;border-radius:50%;background:radial-gradient(circle,rgba(59,130,246,.16),rgba(29,78,216,.08) 50%,transparent 70%);filter:blur(30px);pointer-events:none}
  .pagehead .wrap{position:relative;z-index:1}
  .kick{font-size:12px;font-weight:700;letter-spacing:.16em;text-transform:uppercase;color:var(--cyan);margin-bottom:14px;display:flex;align-items:center;gap:10px}
  .kick::before{content:"";width:22px;height:1px;background:var(--cyan);display:inline-block}
  h1{font-size:clamp(34px,6vw,58px);letter-spacing:-.04em;line-height:1.02;font-weight:850}
  .pagehead p{color:var(--muted);font-size:16.5px;margin-top:18px;max-width:54ch}

  .body{padding:56px 0 40px}
  .block{margin-bottom:44px}
  .block h2{font-size:clamp(20px,3vw,26px);letter-spacing:-.02em;font-weight:800;margin-bottom:16px;display:flex;align-items:center;gap:12px}
  .block h2 .num{font-size:12px;letter-spacing:.14em;color:var(--cyan);font-weight:700;font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
  .block p{color:#c3cbd6;font-size:15.5px;margin-bottom:14px}
  .block p:last-child{margin-bottom:0}
  .block strong{color:var(--ink);font-weight:650}

  .list{list-style:none;display:flex;flex-direction:column;gap:12px;margin:8px 0 4px}
  .list li{display:flex;gap:12px;align-items:flex-start;color:#c3cbd6;font-size:15px}
  .list .tick{color:var(--lime);font-weight:800;flex:none;margin-top:2px}
  .list b{color:var(--ink);font-weight:650}

  .callout{border:1px solid var(--line);border-radius:var(--radius);padding:26px 28px;background:
    radial-gradient(500px circle at 0% 0%,rgba(59,130,246,.08),transparent 60%),var(--panel)}
  .callout h2{margin-bottom:14px}

  .warn{border:1px solid #1e3a5f;border-radius:var(--radius);padding:30px 30px;background:linear-gradient(180deg,#0c1524,#0a1018)}
  .warn h2{color:#93c5fd}
  .warn h2 .num{color:#60a5fa}
  .warn p{color:#c7d2fe}
  .warn p strong{color:#fff}

  .cta-row{margin-top:44px;display:flex;gap:12px;flex-wrap:wrap}
  .btn-l{background:linear-gradient(120deg,var(--lime),#93c5fd);color:#0a1005;padding:13px 22px;box-shadow:0 10px 30px -12px rgba(125,211,252,.75)}

  footer{border-top:1px solid var(--line);margin-top:64px;padding:40px 0}
  .fr{display:flex;justify-content:space-between;align-items:center;gap:22px;flex-wrap:wrap}
  .fl{display:flex;gap:24px;font-size:13.5px;color:var(--muted);flex-wrap:wrap}
  .fl a:hover{color:var(--ink)}
  .copy{font-size:12.5px;color:var(--dim)}

  header .wrap{max-width:none}

  .review{border:1px solid var(--line);border-radius:var(--radius);padding:28px 30px;max-width:660px;
    background:radial-gradient(500px circle at 0% 0%,rgba(59,130,246,.10),transparent 62%),var(--panel)}
  .review .who{display:flex;align-items:center;gap:14px;margin-bottom:16px}
  .review .avatar{width:52px;height:52px;border-radius:50%;object-fit:cover;border:1px solid var(--line);box-shadow:0 0 22px -6px rgba(59,130,246,.65)}
  .review .name{font-weight:800;font-size:17px;letter-spacing:-.01em}
  .review .role{font-size:12.5px;color:var(--dim)}
  .review .stars{color:#fbbf24;font-size:18px;letter-spacing:3px;margin-bottom:14px;line-height:1}
  .review q{quotes:none;display:block;font-size:clamp(19px,2.6vw,23px);line-height:1.4;font-weight:700;letter-spacing:-.015em;color:var(--ink)}
  .review q::before,.review q::after{content:""}
  .review .meta{margin-top:16px;font-size:12.5px;color:var(--dim)}
</style>
</head>
<body>

<header>
  <div class="wrap">
    <nav>
      <a class="logo" href="index.html"><img class="mark" src="logo.png" alt="Neutronic logo"> Neutronic</a>
      <div class="nl">
        <a href="info.html">Info</a>
        <a class="active" href="reviews.html">Reviews</a>
        <a href="help.html">Help</a>
        <a href="index.html#contact">Contact</a>
      </div>
      <a class="btn btn-p" href="https://discord.gg/xa55bzKVTQ" target="_blank" rel="noopener">Discord</a>
    </nav>
  </div>
</header>

<main>
  <section class="pagehead">
    <div class="glow"></div>
    <div class="wrap">
      <p class="kick">Reviews</p>
      <h1>What people say.</h1>
      <p>Real words from the people who use what we build.</p>
    </div>
  </section>

  <div class="wrap body">
    <div class="review">
      <div class="who">
        <img class="avatar" src="team-neutronic.webp" alt="Neutronic profile picture">
        <div>
          <div class="name">Neutronic</div>
          <div class="role">Developer</div>
        </div>
      </div>
      <div class="stars" role="img" aria-label="Rated 5 out of 5 stars">&#9733;&#9733;&#9733;&#9733;&#9733;</div>
      <q>Absolutely Epic Scripts And Software!</q>
      <div class="meta">Rated 5 / 5</div>
    </div>
  </div>
</main>

<footer>
  <div class="wrap">
    <div class="fr">
      <a class="logo" href="index.html"><img class="mark" src="logo.png" alt="Neutronic logo"> Neutronic</a>
      <div class="fl">
        <a href="info.html">Info</a>
        <a href="reviews.html">Reviews</a>
        <a href="help.html">Help</a>
        <a href="https://discord.gg/xa55bzKVTQ" target="_blank" rel="noopener">Discord</a>
      </div>
      <span class="copy">© 2026 Neutronic</span>
    </div>
  </div>
</footer>

</body>
</html>
